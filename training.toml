# Self-play search and exploration settings.
[self_play]
threads = 16
games_per_thread = 64
model_refresh_per_updates = 50
simulations = 100
dirichlet_alpha = 0.3
dirichlet_epsilon = 0.25
temperature_start = 1.0
temperature_end = 0.1
temperature_decay_moves = 10

[evaluation]
threads = 8
games_per_thread = 16
every_updates = 10
depths = [2, 4, 6]
games = 200
simulations = 100

[search]
c_puct = 1.0

[model]
hidden_size = 64
num_res_blocks = 6
# initial_checkpoint = "checkpoints/model-step-3200.mpk"

[training]
# Train continuously from completed self-play games until this many updates finish.
total_updates = 10000
batch_size = 512
# Keep complete recent games; batches sample uniformly from all their positions.
replay_capacity_games = 200
learning_rate = 0.001
l2_coefficient = 0.0001
checkpoint_every_updates = 100
checkpoint_dir = "checkpoints"
